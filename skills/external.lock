# External global skills, pinned by commit.
#
# install.sh clones each repository once into a machine-local cache, checks out
# the exact commit below, and symlinks the named skill directory into
# ~/.agents/skills/. Nothing is vendored into this repository, so their
# licenses stay with their sources: all three are MIT.
#
# To move Ponytail's pin: scripts/update-ponytail.sh (see README.md).
# For other sources, review the release diff, change the sha, then reinstall.
# Never track a branch here: moving shared skills change every project's behavior.
#
# Format, tab-separated:
#   <our-id> <repo> <commit> <path-in-repo> <installed-skill-name>
#
# Reviewed 2026-10-20 against official upstream stable releases:
# obra/superpowers v7.0.0; DietrichGebert/ponytail v5.3.2;
# addyosmani/agent-skills 0.6.13. Exact commits below, never moving tags.
#
# Known deviations:
#   - ponytail:implement does not exist upstream. The repository ships exactly
#     six skills (ponytail, -review, -audit, -debt, -gain, -help). The core
#     `ponytail` skill is the closest counterpart and is what gets installed:
#     lazy-implementation discipline for a coding task, not an implementation
#     workflow. The id below records that substitution honestly.
#   - addyosmani skills link to ../../references/*.md at the repository root,
#     outside their own directory, so install.sh also links ~/.agents/references
#     at the parent that those relative paths resolve to.

