<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firstmate Board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161b;
    --panel: #1c1f26;
    --card: #23262f;
    --border: #333744;
    --text: #e6e8ee;
    --muted: #9aa0ad;
    --accent: #5b8cff;
    --review: #e3b341;
    --blocked: #e5534b;
    --done: #57ab5a;
    --todo: #6e7684;
    --progress: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
  }
  #generated {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
  }
  #tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0b0d11;
    font-weight: 600;
  }
  main {
    padding: 14px;
    display: flex;
    gap: 12px;
    overflow-x: auto;
    align-items: flex-start;
  }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 240px;
    flex: 1 1 240px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 70px);
  }
  .column-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .column-head .dot { width: 9px; height: 9px; border-radius: 50%; }
  .column-head .count {
    margin-left: auto;
    color: var(--muted);
    font-weight: 400;
  }
  .column[data-state="todo"] .dot { background: var(--todo); }
  .column[data-state="in_progress"] .dot { background: var(--progress); }
  .column[data-state="waiting_review"] .dot { background: var(--review); }
  .column[data-state="blocked"] .dot { background: var(--blocked); }
  .column[data-state="done"] .dot { background: var(--done); }
  .column[data-state="waiting_review"] { border-color: var(--review); }
  .cards {
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card .id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .card .title {
    font-size: 13px;
    font-weight: 600;
  }
  .card .meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card .project-badge {
    font-size: 10px;
    background: #2c3040;
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--muted);
  }
  .review-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background: var(--review);
    color: #2a2000;
    border-radius: 4px;
    padding: 1px 6px;
    align-self: flex-start;
  }
  .card.needs-review { border-color: var(--review); }
  .empty {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 2px;
  }
  #empty-state {
    padding: 40px;
    text-align: center;
    color: var(--muted);
  }
  .detail-link {
    align-self: flex-start;
    font-size: 12px;
    color: var(--accent);
  }
  a:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #detail {
    padding: 14px 18px 40px;
    max-width: 960px;
  }
  #detail .back { display: inline-block; margin-bottom: 12px; color: var(--accent); }
  #detail h2 { margin: 0 0 4px; font-size: 20px; }
  #detail h2:focus { outline: none; }
  #detail .id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  #detail .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  #detail .badge {
    font-size: 11px;
    background: #2c3040;
    border-radius: 4px;
    padding: 2px 8px;
    color: var(--text);
  }
  #detail section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 12px;
  }
  #detail h3 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  #detail dl {
    display: grid;
    grid-template-columns: minmax(110px, max-content) 1fr;
    gap: 6px 14px;
    margin: 0;
  }
  #detail dt { color: var(--muted); }
  #detail dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #detail .notice { color: var(--muted); margin: 0 0 8px; }
  #detail .missing { color: var(--muted); font-style: italic; }
  #detail .none { color: var(--muted); }
  #detail a { color: var(--accent); }
  [hidden] { display: none !important; }
  @media (max-width: 720px) {
    main { flex-direction: column; overflow-x: visible; }
    .column { max-width: none; max-height: none; }
    .cards { overflow-y: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>Firstmate Board</h1>
  <div id="tabs"></div>
  <span id="generated"></span>
</header>
<main id="board"></main>
<div id="empty-state" hidden>No tasks yet. Run <code>fm-board add</code> or wait for Firstmate to dispatch work.</div>
<article id="detail" hidden></article>
<script src="board-data.js"></script>
<script>
(function () {
  "use strict";
  var COLUMNS = [
    ["todo", "Todo"],
    ["in_progress", "In Progress"],
    ["waiting_review", "Waiting Review"],
    ["blocked", "Blocked"],
    ["done", "Completed"]
  ];
  var STATE_LABELS = {};
  COLUMNS.forEach(function (c) { STATE_LABELS[c[0]] = c[1]; });
  // The page is a static file:// snapshot; `fm-board open` keeps
  // board-data.js current while its viewer runs, and the page re-reads it on
  // this cadence so an open board follows transitions without a refresh.
  var REFRESH_MS = 3000;

  var data, tasks, projects;
  var activeProject = "__all__";

  function load(next) {
    data = (typeof next === "object" && next) || { tasks: [], generated_at: null };
    tasks = Array.isArray(data.tasks) ? data.tasks : [];
    projects = Array.from(new Set(tasks.map(function (t) { return t.project || "(unassigned)"; }))).sort();
    if (activeProject !== "__all__" && projects.indexOf(activeProject) === -1) activeProject = "__all__";
    document.getElementById("generated").textContent = data.generated_at
      ? "generated " + data.generated_at
      : "";
  }
  load(window.BOARD_DATA);

  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.className) node.className = opts.className;
    if (opts.text !== undefined) node.textContent = opts.text;
    return node;
  }

  // A project tab always shows the board, leaving any open detail view.
  function selectProject(p) {
    activeProject = p;
    if (routeId() !== null) location.hash = "";
    else render();
  }

  function renderTabs() {
    var tabsEl = document.getElementById("tabs");
    tabsEl.textContent = "";
    var all = el("button", { className: "tab" + (activeProject === "__all__" ? " active" : ""), text: "All Projects" });
    all.addEventListener("click", function () { selectProject("__all__"); });
    tabsEl.appendChild(all);
    projects.forEach(function (p) {
      var btn = el("button", { className: "tab" + (activeProject === p ? " active" : ""), text: p });
      btn.addEventListener("click", function () { selectProject(p); });
      tabsEl.appendChild(btn);
    });
  }

  function taskCard(t) {
    var needsReview = t.state === "waiting_review" || !!t.captain_review;
    var card = el("div", { className: "card" + (needsReview ? " needs-review" : "") });
    if (needsReview) {
      card.appendChild(el("span", { className: "review-badge", text: t.captain_review ? "Captain review" : "Review" }));
    }
    card.appendChild(el("div", { className: "id", text: t.id || "" }));
    card.appendChild(el("div", { className: "title", text: t.title || "(untitled)" }));
    var meta = el("div", { className: "meta" });
    meta.appendChild(el("span", { className: "project-badge", text: t.project || "(unassigned)" }));
    if (t.agent) meta.appendChild(el("span", { text: t.agent }));
    if (t.running) meta.appendChild(el("span", { text: t.running }));
    if (t.updated_at) meta.appendChild(el("span", { text: "updated " + t.updated_at }));
    if (t.hold_reason && t.state !== "done") {
      meta.appendChild(el("span", { text: "hold: " + t.hold_reason }));
    }
    card.appendChild(meta);
    var link = el("a", { className: "detail-link", text: "Details \u2192" });
    link.href = "#task/" + encodeURIComponent(t.id || "");
    link.setAttribute("data-id", t.id || "");
    link.setAttribute("aria-label", "Details for " + (t.title || t.id || "task"));
    card.appendChild(link);
    return card;
  }

  function render() {
    renderTabs();
    var board = document.getElementById("board");
    board.textContent = "";
    var visible = tasks.filter(function (t) {
      return activeProject === "__all__" || (t.project || "(unassigned)") === activeProject;
    });
    document.getElementById("empty-state").hidden = tasks.length !== 0;
    COLUMNS.forEach(function (pair) {
      var state = pair[0], label = pair[1];
      var col = el("div", { className: "column" });
      col.setAttribute("data-state", state);
      var head = el("div", { className: "column-head" });
      head.appendChild(el("span", { className: "dot" }));
      head.appendChild(el("span", { text: label }));
      var colTasks = visible.filter(function (t) { return t.state === state; });
      head.appendChild(el("span", { className: "count", text: String(colTasks.length) }));
      col.appendChild(head);
      var cards = el("div", { className: "cards" });
      if (colTasks.length === 0) {
        cards.appendChild(el("div", { className: "empty", text: "\u2014" }));
      } else {
        colTasks
          .slice()
          .sort(function (a, b) { return (b.updated_at || "").localeCompare(a.updated_at || ""); })
          .forEach(function (t) { cards.appendChild(taskCard(t)); });
      }
      col.appendChild(cards);
      board.appendChild(col);
    });
  }

  // Detail view: "#task/<id>" shows one task, an empty hash the board; plain
  // links keep both keyboard- and back-button-navigable in any viewer.
  function routeId() {
    var m = /^#task\/(.+)$/.exec(location.hash);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  // A value cell. null/undefined is information no source has (missing);
  // "" is information its source reports as empty. Text is never parsed as
  // markup; only http(s) URLs become links.
  function value(v, missing) {
    var dd = el("dd");
    if (v === null || v === undefined) {
      dd.appendChild(el("span", { className: "missing", text: missing || "Not recorded" }));
      return dd;
    }
    if (v === "") {
      dd.appendChild(el("span", { className: "none", text: "None" }));
      return dd;
    }
    if (typeof v === "boolean") v = v ? "yes" : "no";
    String(v).split(/(https?:\/\/[^\s"'<>]+)/).forEach(function (part, i) {
      if (i % 2) {
        var a = el("a", { text: part });
        a.href = part;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        dd.appendChild(a);
      } else if (part) {
        dd.appendChild(document.createTextNode(part));
      }
    });
    return dd;
  }

  function section(title, rows, notice) {
    var s = el("section");
    s.appendChild(el("h3", { text: title }));
    if (notice) s.appendChild(el("p", { className: "notice", text: notice }));
    var dl = el("dl");
    rows.forEach(function (r) {
      dl.appendChild(el("dt", { text: r[0] }));
      dl.appendChild(value(r[1], r[2]));
    });
    s.appendChild(dl);
    return s;
  }

  // Board-owned fields are always projected, so null there means empty.
  function nz(v) { return v === null || v === undefined ? "" : v; }

  function renderDetail(id) {
    var view = document.getElementById("detail");
    view.textContent = "";
    var back = el("a", { className: "back", text: "\u2190 Back to board" });
    back.href = "#";
    view.appendChild(back);
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    var heading = el("h2", { text: t ? (t.title || "(untitled)") : "Task not on the board" });
    heading.tabIndex = -1;
    view.appendChild(heading);
    view.appendChild(el("div", { className: "id", text: id }));
    if (!t) {
      view.appendChild(el("p", { className: "notice", text: "FirstMate no longer tracks this task, so the board retired it." }));
      return heading;
    }
    var d = t.details || {};
    var b = d.backlog, dec = d.decision, land = d.landed;
    var bv = b || {};
    var bm = b ? undefined : (t.source === "manual" ? "Not tracked (manual board row)" : "Not available");
    var badges = el("div", { className: "badges" });
    badges.appendChild(el("span", { className: "badge", text: STATE_LABELS[t.state] || t.state || "?" }));
    badges.appendChild(el("span", { className: "badge", text: t.project || "(unassigned)" }));
    if (t.kind) badges.appendChild(el("span", { className: "badge", text: t.kind }));
    if (t.captain_review) badges.appendChild(el("span", { className: "review-badge", text: "Captain review" }));
    view.appendChild(badges);
    view.appendChild(section("Description", [["Body", bv.body, bm]], b ? null : (t.source === "manual"
      ? "Manual board row: FirstMate's backlog does not track it."
      : "FirstMate's backlog has no record of this task, so its backlog fields are not available.")));
    view.appendChild(section("Status", [
      ["Board column", STATE_LABELS[t.state] || nz(t.state)],
      ["Worker", nz(t.agent)],
      ["Worker activity", nz(t.running)],
      ["Captain review", !!t.captain_review],
      ["Board hold", nz(t.hold_reason)],
      ["Since", nz(t.since)],
      ["Updated", nz(t.updated_at)]
    ]));
    view.appendChild(section("Hold and backlog state", [
      ["Backlog state", bv.state, bm],
      ["Held", bv.held, bm],
      ["Hold kind", bv.hold_kind, bm],
      ["Hold until", bv.hold_until, bm],
      ["Hold reason", bv.hold_reason, bm],
      ["Priority", bv.priority, bm],
      ["Created", bv.created, bm],
      ["Closed", bv.closed, bm]
    ]));
    view.appendChild(section("Dependencies", [
      ["Depends on", bv.deps, bm],
      ["Blocked", bv.blocked, bm],
      ["Blocked by", bv.blocked_by, bm]
    ]));
    var completion = land && land.completion;
    view.appendChild(section("Review and decisions", [
      ["Open decision", dec ? [dec.verb, dec.summary].filter(Boolean).join(": ") : ""],
      ["Decision reason", dec ? nz(dec.reason) : ""],
      ["Landed", completion ? [completion.verb, completion.date].filter(Boolean).join(" ") : ""]
    ]));
    view.appendChild(section("Notes", [
      ["Board note", nz(t.note)],
      ["Landing note", land ? nz(land.local_note) : ""]
    ]));
    view.appendChild(section("Links", [
      ["Backlog links", bv.links, bm],
      ["Pull request", land ? nz(land.pr_url) : ""],
      ["Report", land ? nz(land.report_path) : ""]
    ]));
    return heading;
  }

  // Render the view the hash names. `fromNav` moves focus with the
  // navigation: to the detail heading, or back to the card's own link.
  var lastDetailId = null;
  function route(fromNav) {
    var id = routeId();
    var detail = document.getElementById("detail");
    if (id !== null) {
      renderTabs();
      document.getElementById("board").hidden = true;
      document.getElementById("empty-state").hidden = true;
      detail.hidden = false;
      var hadFocus = detail.contains(document.activeElement);
      var heading = renderDetail(id);
      lastDetailId = id;
      if (fromNav) { window.scrollTo(0, 0); heading.focus(); }
      else if (hadFocus) heading.focus({ preventScroll: true });
      return;
    }
    detail.hidden = true;
    document.getElementById("board").hidden = false;
    render();
    if (fromNav && lastDetailId !== null) {
      var link = Array.prototype.filter.call(document.querySelectorAll("a.detail-link"), function (a) {
        return a.getAttribute("data-id") === lastDetailId;
      })[0];
      if (link) link.focus();
    }
    lastDetailId = null;
  }

  window.addEventListener("hashchange", function () { route(true); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && routeId() !== null) location.hash = "";
  });
  route(false);

  // Re-read board-data.js by re-injecting its script tag (the one way a
  // file:// page can re-load a sibling file); re-render only on a new
  // generation so the active project tab and the open view survive every
  // refresh.
  setInterval(function () {
    var s = document.createElement("script");
    s.src = "board-data.js?t=" + Date.now();
    s.onload = s.onerror = function () {
      s.remove();
      var next = window.BOARD_DATA;
      if (next && next.generated_at !== data.generated_at) {
        load(next);
        route(false);
      }
    };
    document.head.appendChild(s);
  }, REFRESH_MS);
})();
</script>
</body>
</html>
